name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  swift-build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode 16.4
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Print Swift version
      run: swift --version

    - name: Build Swift package (release)
      working-directory: swift
      run: swift build -c release

    - name: Run Swift tests
      working-directory: swift
      run: swift test

    - name: Assemble ExhaustedModel.app
      working-directory: swift
      run: ./scripts/build-app.sh

    - name: Verify app bundle and resources
      working-directory: swift
      run: |
        test -d dist/ExhaustedModel.app
        test -d dist/ExhaustedModel.app/Contents/Resources/ExhaustedModel_ExhaustedModel.bundle
        dist/ExhaustedModel.app/Contents/MacOS/ExhaustedModel --verify-resources

    - name: Smoke test (--diagnose)
      working-directory: swift
      run: .build/release/ExhaustedModel --diagnose

    - name: Upload app bundle
      uses: actions/upload-artifact@v4
      with:
        name: ExhaustedModel-app-debug
        path: swift/dist/ExhaustedModel.app
